name: Optional Swift CodeQL analysis

# Expensive initial extraction: opt in explicitly, never delay normal PRs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-swift:
    name: Optional Swift analysis
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build ARM64 app for analysis
        run: |
          xcodebuild build \
            -project MenuBarIO.xcodeproj \
            -scheme MenuBarIO \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/codeql-derived-data" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
      - name: Analyze into an on-demand report
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # Keep the optional scan out of the mandatory code-scanning baseline.
          upload: false
          output: ${{ runner.temp }}/swift-codeql-report
      - name: Save report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-codeql-report
          path: ${{ runner.temp }}/swift-codeql-report/*.sarif
          if-no-files-found: error
          retention-days: 7
