name: Verify macOS app

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  # Non-administrative recovery path if GitHub delays a pull-request event.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install ripgrep for the privacy audit
        run: brew install ripgrep
      - name: Verify Apple Silicon build
        run: MENUBARIO_TEST_ARCH=arm64 ./script/verify.sh
