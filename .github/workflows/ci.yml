name: Verify macOS app

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  # Non-administrative recovery path if GitHub delays a pull-request event.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep for the privacy audit
        run: brew install ripgrep
      - name: Verify Apple Silicon and Universal build
        run: MENUBARUSB_TEST_ARCH=arm64 ./script/verify.sh

  verify-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep for the privacy audit
        run: brew install ripgrep
      - name: Verify Intel and Universal build
        run: MENUBARUSB_TEST_ARCH=x86_64 ./script/verify.sh
